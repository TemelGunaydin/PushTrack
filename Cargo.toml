[package]
name = "pushtrack"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal dashboard for Git commits you still need to push"
repository = "https://github.com/TemelGunaydin/PushTrack"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
nix = { version = "0.31", features = ["signal", "process"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
